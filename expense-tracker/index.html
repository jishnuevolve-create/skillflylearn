<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Expenses</title>
<meta name="description" content="Record project expenses for each interior design client and see monthly spend per client. Data stays in this browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F5FC;
    --surface: #FFFFFF;
    --surface-2: #EEEEF8;
    --text: #14183C;
    --muted: #5B5F82;
    --border: #DCDCEC;
    --primary: #2A1FA8;
    --primary-text: #FFFFFF;
    --accent: #FF7A2F;
    --danger: #C62828;
    --ok: #1B7F4B;
    --shadow: 0 1px 2px rgba(20, 24, 60, .06), 0 4px 16px rgba(20, 24, 60, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1124;
      --surface: #181B33;
      --surface-2: #22264A;
      --text: #ECEDF8;
      --muted: #A3A6C8;
      --border: #2E3260;
      --primary: #8C82FF;
      --primary-text: #0F1124;
      --accent: #FF9A5C;
      --danger: #FF6B6B;
      --ok: #4CD38A;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1124;
    --surface: #181B33;
    --surface-2: #22264A;
    --text: #ECEDF8;
    --muted: #A3A6C8;
    --border: #2E3260;
    --primary: #8C82FF;
    --primary-text: #0F1124;
    --accent: #FF9A5C;
    --danger: #FF6B6B;
    --ok: #4CD38A;
    --shadow: none;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "DM Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2 { font-family: "Poppins", system-ui, sans-serif; margin: 0; }
  h1 { font-size: 1.5rem; }
  h2 { font-size: 1.05rem; margin-bottom: 12px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }

  header.top {
    display: flex; flex-wrap: wrap; gap: 12px;
    align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }
  .top-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .print-only { display: none; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    box-shadow: var(--shadow);
  }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat .label { color: var(--muted); font-size: .85rem; }
  .stat .value { font-family: "Poppins", sans-serif; font-size: 1.35rem; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .stat .sub { color: var(--muted); font-size: .8rem; margin-top: 4px; }
  .over { color: var(--danger); }
  .under { color: var(--ok); }

  .meter { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
  .meter > span { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
  .meter.is-over > span { background: var(--danger); }

  .grid { display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: start; }
  .side, .main { display: grid; gap: 16px; }

  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  .field { margin-bottom: 12px; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .inline { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  input, select, button { font: inherit; color: inherit; }
  input, select {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
  }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  .top-controls input, .top-controls select { width: auto; }

  button {
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 8px 12px;
    border-radius: 9px;
    cursor: pointer;
  }
  button:hover { background: var(--surface-2); }
  button.primary { background: var(--primary); color: var(--primary-text); border-color: var(--primary); font-weight: 700; }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: var(--danger); }
  button.small { padding: 4px 8px; font-size: .8rem; }
  button.link { border: 0; background: none; color: var(--primary); padding: 0; font-size: .85rem; }
  .form-actions { display: flex; gap: 8px; }
  .form-actions .primary { flex: 1; }

  /* client summary table */
  .summary { width: 100%; border-collapse: collapse; font-size: .92rem; }
  .summary th { text-align: left; color: var(--muted); font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 0 8px 8px; border-bottom: 1px solid var(--border); }
  .summary td { padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .summary .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .summary tbody tr { cursor: pointer; }
  .summary tbody tr:hover { background: var(--surface-2); }
  .summary tbody tr.active { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--primary); }
  .summary tfoot td { font-weight: 700; border-bottom: 0; }
  .summary .share { width: 28%; }
  .share-bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .share-bar span { display: block; height: 100%; border-radius: 999px; background: var(--primary); }
  .client-name { font-weight: 600; overflow-wrap: anywhere; }
  .client-sub { color: var(--muted); font-size: .78rem; }

  .cat-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; margin-bottom: 10px; font-size: .9rem; }
  .cat-row .bar { grid-column: 1 / -1; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .cat-row .bar span { display: block; height: 100%; border-radius: 999px; }
  .cat-row .amt { font-variant-numeric: tabular-nums; }
  .cat-row .pct { color: var(--muted); font-size: .8rem; margin-left: 6px; }

  /* clients manager */
  .client-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .client-item:last-child { border-bottom: 0; }
  .client-item .head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .client-item .totals { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .client-item .btns { display: flex; gap: 4px; margin-top: 6px; }
  .badge { font-size: .7rem; padding: 1px 6px; border-radius: 999px; background: var(--surface-2); color: var(--muted); margin-left: 6px; }

  .list-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .list-head h2 { margin: 0; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filters input, .filters select { width: auto; max-width: 100%; }

  .group { margin-top: 14px; }
  .group-head { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 0 4px 6px; border-bottom: 1px solid var(--border); }
  .item { display: grid; grid-template-columns: 36px 1fr auto auto; gap: 10px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--border); }
  .item:last-child { border-bottom: 0; }
  .dot { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 1.1rem; }
  .item .title { font-weight: 500; overflow-wrap: anywhere; }
  .item .meta { color: var(--muted); font-size: .8rem; overflow-wrap: anywhere; }
  .item .amount { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item .actions { display: flex; gap: 4px; }

  .empty { text-align: center; color: var(--muted); padding: 28px 8px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .note { color: var(--muted); font-size: .8rem; margin-top: 10px; }

  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(150%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px;
    transition: transform .25s; z-index: 10; display: flex; width: max-content; max-width: calc(100% - 32px); gap: 12px; align-items: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast button { background: transparent; color: var(--bg); border-color: currentColor; }

  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
    .side, .main { display: contents; }
    #form { order: 1; }
    #summaryCard { order: 2; }
    #listCard { order: 3; }
    #clientsCard { order: 4; }
    #catCard { order: 5; }
    #dataCard { order: 6; }
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 480px) {
    .item { grid-template-columns: 32px 1fr auto; }
    .item .actions { grid-column: 2 / -1; justify-content: flex-end; }
    .dot { width: 32px; height: 32px; }
    .summary .share { display: none; }
  }

  @media print {
    :root, :root[data-theme="dark"] {
      --bg: #fff; --surface: #fff; --surface-2: #eee; --text: #000; --muted: #444; --border: #ccc; --primary: #2A1FA8; --shadow: none;
    }
    .wrap { max-width: none; padding: 0; }
    .no-print, #form, #clientsCard, #dataCard, .top-controls, .item .actions, .filters, .toast { display: none !important; }
    .print-only { display: block; }
    .grid { grid-template-columns: 1fr; }
    .card { border: 0; padding: 0; break-inside: auto; }
    .summary tbody tr.active { box-shadow: none; }
    .stats { grid-template-columns: repeat(4, 1fr); }
    .stat { border: 1px solid var(--border) !important; padding: 10px !important; }
    .group { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Client Expenses</h1>
      <div class="print-only" id="printHeading"></div>
    </div>
    <div class="top-controls">
      <input type="month" id="month" aria-label="Month">
      <button id="prevMonth" aria-label="Previous month">‹</button>
      <button id="nextMonth" aria-label="Next month">›</button>
      <button id="printBtn" type="button">Print / PDF</button>
      <button id="themeBtn" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <section class="stats">
    <div class="card stat">
      <div class="label">Spent this month</div>
      <div class="value" id="statTotal">–</div>
      <div class="sub" id="statPrev"></div>
    </div>
    <div class="card stat">
      <div class="label">Clients with spend</div>
      <div class="value" id="statClients">–</div>
      <div class="sub" id="statClientsSub"></div>
    </div>
    <div class="card stat">
      <div class="label">Highest-spend client</div>
      <div class="value" id="statTop">–</div>
      <div class="sub" id="statTopSub"></div>
    </div>
    <div class="card stat">
      <div class="label">Biggest category</div>
      <div class="value" id="statCat">–</div>
      <div class="sub" id="statCatSub"></div>
    </div>
  </section>

  <div class="grid">
    <div class="side">
      <form class="card" id="form" autocomplete="off">
        <h2 id="formTitle">Record expense</h2>
        <div class="field">
          <label for="client">Client / project</label>
          <div class="inline">
            <select id="client" required></select>
            <button type="button" id="quickClient" title="Add a new client">+ New</button>
          </div>
        </div>
        <div class="row-2">
          <div class="field">
            <label for="amount">Amount</label>
            <input id="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required placeholder="0.00">
          </div>
          <div class="field">
            <label for="date">Date</label>
            <input id="date" type="date" required>
          </div>
        </div>
        <div class="row-2" style="grid-template-columns: 1.6fr 1fr;">
          <div class="field">
            <label for="item">Item</label>
            <input id="item" type="text" list="itemList" maxlength="60" placeholder="e.g. Plywood">
            <datalist id="itemList"></datalist>
          </div>
          <div class="field">
            <label for="qty">Quantity</label>
            <input id="qty" type="text" maxlength="30" placeholder="e.g. 12 sheets">
          </div>
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category" required></select>
        </div>
        <div class="field">
          <label for="vendor">Vendor / paid to</label>
          <input id="vendor" type="text" maxlength="80" placeholder="e.g. vendor, shop or contractor name">
        </div>
        <div class="field">
          <label for="note">Description / work area</label>
          <input id="note" type="text" maxlength="160" placeholder="e.g. 18mm BWP ply for kitchen cabinets">
        </div>
        <div class="row-2">
          <div class="field">
            <label for="method">Paid with</label>
            <select id="method">
              <option>UPI</option>
              <option>Cash</option>
              <option>Bank transfer</option>
              <option>Cheque</option>
              <option>Company card</option>
              <option>Paid by client</option>
              <option>Other</option>
            </select>
          </div>
          <div class="field">
            <label for="bill">Bill / invoice no.</label>
            <input id="bill" type="text" maxlength="40" placeholder="Optional">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="primary" id="submitBtn">Add expense</button>
          <button type="button" id="cancelEdit" hidden>Cancel</button>
        </div>
      </form>

      <div class="card" id="clientsCard">
        <h2>Clients</h2>
        <form id="clientForm" autocomplete="off">
          <div class="field">
            <label for="clientName" id="clientFormLabel">Add a client</label>
            <input id="clientName" type="text" maxlength="60" required placeholder="e.g. Mehta Residence, Kochi">
          </div>
          <div class="field">
            <label for="clientBudget">Project budget (optional)</label>
            <input id="clientBudget" type="number" min="0" step="1" inputmode="numeric" placeholder="Total for the whole project">
          </div>
          <div class="form-actions">
            <button type="submit" class="primary" id="clientSubmit">Add client</button>
            <button type="button" id="clientCancel" hidden>Cancel</button>
          </div>
        </form>
        <div id="clientList" style="margin-top:12px"></div>
        <button type="button" class="link" id="toggleArchived" hidden></button>
      </div>

      <div class="card" id="catCard">
        <h2>By category · <span id="catMonth"></span></h2>
        <div id="breakdown"></div>
      </div>

      <div class="card" id="dataCard">
        <h2>Data</h2>
        <div class="tools">
          <button id="exportBtn" type="button">Export all (CSV)</button>
          <button id="exportMonthBtn" type="button">Month summary (CSV)</button>
          <button id="importBtn" type="button">Import CSV</button>
          <button id="clearBtn" type="button" class="danger">Delete all</button>
          <input id="importFile" type="file" accept=".csv,text/csv" hidden>
        </div>
        <p class="note">Everything is saved only in this browser. Export a CSV regularly as a backup.</p>
      </div>
    </div>

    <div class="main">
      <section class="card" id="summaryCard">
        <h2 id="summaryTitle">Spend by client</h2>
        <div id="summary"></div>
      </section>

      <section class="card" id="listCard">
        <div class="list-head">
          <h2 id="listTitle">Expenses</h2>
          <div class="filters">
            <select id="filterClient" aria-label="Filter by client"></select>
            <select id="filterCat" aria-label="Filter by category"></select>
            <select id="groupBy" aria-label="Group by">
              <option value="client">Group by client</option>
              <option value="day">Group by date</option>
            </select>
            <input id="search" type="search" placeholder="Search" aria-label="Search">
          </div>
        </div>
        <div id="list"></div>
      </section>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" class="small" hidden>Undo</button></div>

<script>
(function () {
  "use strict";

  const STORE_KEY = "client-expenses.v1";
  const CATEGORIES = [
    { name: "Materials", icon: "🪵", color: "#B07A3F", items: ["Plywood", "MDF board", "HDHMR board", "Particle board", "Block board", "Laminate", "Veneer", "Acrylic sheet", "Glass", "Mirror", "Tiles", "Marble", "Granite", "Quartz countertop", "Wooden flooring", "Vinyl flooring", "Gypsum board", "False ceiling material", "Wallpaper", "Wall panels", "Adhesive", "Edge banding", "Cement & sand"] },
    { name: "Furniture", icon: "🛋️", color: "#7A4FD8", items: ["Sofa", "Bed", "Mattress", "Dining table", "Chairs", "Wardrobe", "Modular kitchen", "TV unit", "Study table", "Shoe rack", "Side table", "Coffee table", "Office workstation", "Custom furniture"] },
    { name: "Lighting & Electrical", icon: "💡", color: "#D8A12A", items: ["Ceiling lights", "Pendant lights", "Chandelier", "Wall lights", "LED strip", "Profile lights", "Spot lights", "Switches & sockets", "Wiring & cables", "Ceiling fan", "DB & MCB"] },
    { name: "Fabric & Upholstery", icon: "🧵", color: "#D8457A", items: ["Curtains", "Blinds", "Curtain rods & tracks", "Upholstery fabric", "Cushions", "Rugs & carpets", "Foam", "Headboard upholstery"] },
    { name: "Paint & Finishes", icon: "🎨", color: "#2FA36B", items: ["Interior paint", "Exterior paint", "Primer", "Wall putty", "Texture paint", "PU polish", "Duco paint", "Melamine polish", "Wood stain"] },
    { name: "Hardware & Fittings", icon: "🔩", color: "#5B6B8A", items: ["Hinges", "Drawer channels", "Handles & knobs", "Locks", "Kitchen accessories", "Wardrobe accessories", "Tandem boxes", "Lift-up fittings", "Screws & nails", "Door stoppers", "Glass fittings"] },
    { name: "Decor & Accessories", icon: "🖼️", color: "#FF7A2F", items: ["Artwork", "Wall decor", "Decorative mirror", "Plants & planters", "Vases & showpieces", "Clocks", "Table decor", "Photo frames"] },
    { name: "Plumbing & Sanitary", icon: "🚿", color: "#2A7FD8", items: ["Taps & mixers", "Wash basin", "Kitchen sink", "WC", "Shower", "Bathroom accessories", "Pipes & fittings", "Water heater"] },
    { name: "Appliances", icon: "🔌", color: "#3FA8D8", items: ["Chimney", "Hob", "Built-in oven", "Microwave", "Refrigerator", "Dishwasher", "Air conditioner", "Water purifier"] },
    { name: "Labour & Contractors", icon: "👷", color: "#C2562A", items: ["Carpenter", "Electrician", "Plumber", "Painter", "Mason", "Tile layer", "Polisher", "False ceiling work", "Helper", "Installation charges", "Civil work"] },
    { name: "Transport & Delivery", icon: "🚚", color: "#1FA8A0", items: ["Material transport", "Loading & unloading", "Courier", "Delivery charges"] },
    { name: "Site Visit & Travel", icon: "🚗", color: "#4F6BD8", items: ["Fuel", "Cab / auto", "Parking & toll", "Site visit"] },
    { name: "Design & Printing", icon: "📐", color: "#A84FD8", items: ["Drawing prints", "3D renders", "Material samples", "Site measurement", "Permits & approvals"] },
    { name: "Other", icon: "📦", color: "#8A8FA8", items: ["Site cleaning", "Debris removal", "Miscellaneous"] }
  ];
  const catByName = Object.fromEntries(CATEGORIES.map(c => [c.name, c]));
  const catInfo = name => catByName[name] || catByName.Other;
  const itemCategory = {};
  for (const c of CATEGORIES) for (const it of c.items) itemCategory[it.toLowerCase()] = c.name;

  // ---------- state ----------
  let state = load();
  let editingId = null;
  let editingClientId = null;
  let showArchived = false;

  function load() {
    const fallback = { clients: [], expenses: [], theme: "" };
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return fallback;
      const data = JSON.parse(raw);
      const clients = Array.isArray(data.clients) ? data.clients.filter(c => c && typeof c.id === "string" && c.name) : [];
      const ids = new Set(clients.map(c => c.id));
      return {
        clients,
        expenses: Array.isArray(data.expenses) ? data.expenses.filter(e => validExpense(e) && ids.has(e.clientId)) : [],
        theme: data.theme || ""
      };
    } catch (e) {
      return fallback;
    }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { toast("Couldn't save — browser storage is unavailable."); }
  }
  function validExpense(e) {
    return e && typeof e.id === "string" && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && Number(e.amount) > 0;
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const clientById = id => state.clients.find(c => c.id === id);
  const clientName = id => (clientById(id) || { name: "Unknown client" }).name;
  const byName = (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" });

  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const monthOf = iso => iso.slice(0, 7);
  const currentMonth = () => $("month").value || monthOf(todayISO());
  function shiftMonth(ym, delta) {
    const [y, m] = ym.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  }
  function money(n) {
    try {
      return new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: 2 }).format(n);
    } catch (e) {
      return n.toFixed(2);
    }
  }
  function monthLabel(ym) {
    const [y, m] = ym.split("-").map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
  }
  function dayLabel(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  }
  const sum = arr => arr.reduce((s, e) => s + e.amount, 0);
  const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") node.className = v;
      else if (k === "style") node.style.cssText = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    }
    for (const c of children) if (c != null) node.append(c);
    return node;
  }

  let toastTimer;
  function toast(msg, onUndo) {
    $("toastMsg").textContent = msg;
    const undoBtn = $("toastUndo");
    undoBtn.hidden = !onUndo;
    undoBtn.onclick = () => { onUndo(); $("toast").classList.remove("show"); };
    $("toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $("toast").classList.remove("show"), onUndo ? 6000 : 2500);
  }

  // ---------- setup ----------
  for (const c of CATEGORIES) $("category").append(el("option", { value: c.name }, `${c.icon} ${c.name}`));
  for (const c of CATEGORIES) for (const it of c.items) $("itemList").append(el("option", { value: it }, c.name));
  $("item").addEventListener("input", () => {
    const cat = itemCategory[$("item").value.trim().toLowerCase()];
    if (cat) $("category").value = cat;
  });
  $("filterCat").append(el("option", { value: "" }, "All categories"));
  for (const c of CATEGORIES) $("filterCat").append(el("option", { value: c.name }, c.name));

  $("month").value = monthOf(todayISO());
  $("date").value = todayISO();
  applyTheme();

  // ---------- render ----------
  function renderClientSelects() {
    const formSel = $("client");
    const keep = formSel.value;
    formSel.replaceChildren();
    const active = state.clients.filter(c => !c.archived).sort(byName);
    if (!active.length) formSel.append(el("option", { value: "" }, "Add a client first →"));
    for (const c of active) formSel.append(el("option", { value: c.id }, c.name));
    // keep an archived client selectable while editing one of its expenses
    const editing = editingId && state.expenses.find(x => x.id === editingId);
    if (editing && clientById(editing.clientId)?.archived) {
      formSel.append(el("option", { value: editing.clientId }, `${clientName(editing.clientId)} (archived)`));
    }
    if ([...formSel.options].some(o => o.value === keep)) formSel.value = keep;

    const fSel = $("filterClient");
    const keepF = fSel.value;
    fSel.replaceChildren(el("option", { value: "" }, "All clients"));
    for (const c of [...state.clients].sort(byName)) fSel.append(el("option", { value: c.id }, c.name + (c.archived ? " (archived)" : "")));
    fSel.value = [...fSel.options].some(o => o.value === keepF) ? keepF : "";
  }

  function render() {
    renderClientSelects();
    const ym = currentMonth();
    const monthExpenses = state.expenses.filter(e => monthOf(e.date) === ym);
    const total = sum(monthExpenses);
    $("printHeading").textContent = `Expense report · ${monthLabel(ym)}`;

    // stats
    $("statTotal").textContent = money(total);
    const prevTotal = sum(state.expenses.filter(e => monthOf(e.date) === shiftMonth(ym, -1)));
    if (prevTotal > 0) {
      const diff = ((total - prevTotal) / prevTotal) * 100;
      $("statPrev").textContent = `${diff >= 0 ? "▲" : "▼"} ${Math.abs(diff).toFixed(0)}% vs last month`;
    } else {
      $("statPrev").textContent = plural(monthExpenses.length, "expense");
    }

    const byClient = new Map();
    for (const e of monthExpenses) {
      const row = byClient.get(e.clientId) || { total: 0, count: 0 };
      row.total += e.amount; row.count++;
      byClient.set(e.clientId, row);
    }
    const clientRows = [...byClient.entries()].sort((a, b) => b[1].total - a[1].total);
    $("statClients").textContent = String(clientRows.length);
    $("statClientsSub").textContent = `of ${plural(state.clients.filter(c => !c.archived).length, "active client")}`;
    if (clientRows.length) {
      $("statTop").textContent = clientName(clientRows[0][0]);
      $("statTopSub").textContent = `${money(clientRows[0][1].total)} · ${((clientRows[0][1].total / total) * 100).toFixed(0)}% of month`;
    } else {
      $("statTop").textContent = "–";
      $("statTopSub").textContent = "";
    }

    const byCat = {};
    for (const e of monthExpenses) byCat[e.category] = (byCat[e.category] || 0) + e.amount;
    const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    if (cats.length) {
      $("statCat").textContent = `${catInfo(cats[0][0]).icon} ${cats[0][0]}`;
      $("statCatSub").textContent = `${money(cats[0][1])} · ${((cats[0][1] / total) * 100).toFixed(0)}% of month`;
    } else {
      $("statCat").textContent = "–";
      $("statCatSub").textContent = "";
    }

    renderSummary(ym, clientRows, total);
    renderCategories(ym, cats, total);
    renderClients();
    renderList(ym, monthExpenses);
  }

  function renderSummary(ym, clientRows, total) {
    $("summaryTitle").textContent = `Spend by client · ${monthLabel(ym)}`;
    const box = $("summary");
    box.replaceChildren();
    if (!clientRows.length) {
      box.append(el("div", { class: "empty" }, state.clients.length ? "No client expenses recorded for this month." : "Start by adding a client, then record expenses against them."));
      return;
    }
    const allTime = clientTotals();
    const selected = $("filterClient").value;
    const tbody = el("tbody");
    for (const [id, row] of clientRows) {
      const c = clientById(id);
      const pct = (row.total / total) * 100;
      let sub = plural(row.count, "expense");
      if (c && c.budget > 0) sub += ` · project ${money(allTime.get(id) || 0)} of ${money(c.budget)}`;
      const tr = el("tr", { class: id === selected ? "active" : "", title: "Show this client's expenses" },
        el("td", null, el("div", { class: "client-name" }, clientName(id)), el("div", { class: "client-sub" }, sub)),
        el("td", { class: "share" }, el("div", { class: "share-bar" }, el("span", { style: `width:${pct}%` }))),
        el("td", { class: "num" }, `${pct.toFixed(0)}%`),
        el("td", { class: "num" }, money(row.total))
      );
      tr.addEventListener("click", () => {
        $("filterClient").value = id === selected ? "" : id;
        render();
        if (id !== selected) $("listCard").scrollIntoView({ behavior: "smooth", block: "start" });
      });
      tbody.append(tr);
    }
    box.append(el("table", { class: "summary" },
      el("thead", null, el("tr", null, el("th", null, "Client"), el("th", { class: "share" }, ""), el("th", { class: "num" }, "Share"), el("th", { class: "num" }, "Spent"))),
      tbody,
      el("tfoot", null, el("tr", null, el("td", null, "Total"), el("td", { class: "share" }, ""), el("td", { class: "num" }, ""), el("td", { class: "num" }, money(total))))
    ));
  }

  function renderCategories(ym, cats, total) {
    $("catMonth").textContent = monthLabel(ym);
    const bd = $("breakdown");
    bd.replaceChildren();
    if (!cats.length) bd.append(el("div", { class: "empty", style: "padding:12px" }, "Nothing recorded this month."));
    for (const [name, amt] of cats) {
      const c = catInfo(name);
      const pct = (amt / total) * 100;
      bd.append(el("div", { class: "cat-row" },
        el("span", null, `${c.icon} ${name}`),
        el("span", { class: "amt" }, money(amt), el("span", { class: "pct" }, `${pct.toFixed(0)}%`)),
        el("div", { class: "bar" }, el("span", { style: `width:${pct}%;background:${c.color}` }))
      ));
    }
  }

  function clientTotals() {
    const m = new Map();
    for (const e of state.expenses) m.set(e.clientId, (m.get(e.clientId) || 0) + e.amount);
    return m;
  }

  function renderClients() {
    const list = $("clientList");
    list.replaceChildren();
    const totals = clientTotals();
    const archivedCount = state.clients.filter(c => c.archived).length;
    const shown = state.clients.filter(c => showArchived || !c.archived).sort(byName);
    if (!state.clients.length) list.append(el("div", { class: "note", style: "margin:0" }, "No clients yet."));
    for (const c of shown) {
      const spent = totals.get(c.id) || 0;
      let totalsText = `${money(spent)} spent in total`;
      let meter = null;
      if (c.budget > 0) {
        const left = c.budget - spent;
        totalsText = `${money(spent)} of ${money(c.budget)} · ${left >= 0 ? money(left) + " left" : money(-left) + " over"}`;
        meter = el("div", { class: "meter" + (left < 0 ? " is-over" : "") }, el("span", { style: `width:${Math.min(100, (spent / c.budget) * 100)}%` }));
      }
      list.append(el("div", { class: "client-item" },
        el("div", { class: "head" },
          el("span", { class: "client-name" }, c.name, c.archived ? el("span", { class: "badge" }, "archived") : null)
        ),
        el("div", { class: "totals" + (c.budget > 0 && spent > c.budget ? " over" : "") }, totalsText),
        meter,
        el("div", { class: "btns" },
          el("button", { class: "small", type: "button", onclick: () => startEditClient(c.id) }, "Edit"),
          el("button", { class: "small", type: "button", onclick: () => toggleArchive(c.id) }, c.archived ? "Restore" : "Archive"),
          el("button", { class: "small danger", type: "button", onclick: () => deleteClient(c.id) }, "Delete")
        )
      ));
    }
    const t = $("toggleArchived");
    t.hidden = archivedCount === 0;
    t.textContent = showArchived ? "Hide archived clients" : `Show ${plural(archivedCount, "archived client")}`;
  }

  function renderList(ym, monthExpenses) {
    const fClient = $("filterClient").value;
    $("listTitle").textContent = fClient ? `${clientName(fClient)} · ${monthLabel(ym)}` : `Expenses · ${monthLabel(ym)}`;
    const q = $("search").value.trim().toLowerCase();
    const fc = $("filterCat").value;
    const shown = monthExpenses
      .filter(e => (!fClient || e.clientId === fClient) && (!fc || e.category === fc))
      .filter(e => !q || [e.item, e.note, e.vendor, e.bill, e.category, e.method, clientName(e.clientId)].some(v => (v || "").toLowerCase().includes(q)))
      .sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));

    const list = $("list");
    list.replaceChildren();
    if (!shown.length) {
      list.append(el("div", { class: "empty" }, monthExpenses.length ? "No expenses match your filters." : "No expenses recorded for this month."));
      return;
    }

    const groupByClient = $("groupBy").value === "client";
    const groups = new Map();
    for (const e of shown) {
      const key = groupByClient ? e.clientId : e.date;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(e);
    }
    let entries = [...groups.entries()];
    if (groupByClient) entries.sort((a, b) => sum(b[1]) - sum(a[1]));

    for (const [key, items] of entries) {
      const group = el("div", { class: "group" },
        el("div", { class: "group-head" },
          el("span", null, groupByClient ? clientName(key) : dayLabel(key)),
          el("span", null, money(sum(items)))
        )
      );
      for (const e of items) {
        const c = catInfo(e.category);
        const meta = [
          groupByClient ? dayLabel(e.date) : clientName(e.clientId),
          e.category,
          e.vendor,
          e.method,
          e.bill ? `Bill ${e.bill}` : null
        ].filter(Boolean).join(" · ");
        group.append(el("div", { class: "item" },
          el("div", { class: "dot", style: `background:${c.color}22` }, c.icon),
          el("div", null,
            el("div", { class: "title" }, [e.item, e.qty && `(${e.qty})`].filter(Boolean).join(" ") || e.note || e.vendor || e.category),
            e.item && e.note ? el("div", { class: "meta" }, e.note) : null,
            el("div", { class: "meta" }, meta)
          ),
          el("div", { class: "amount" }, money(e.amount)),
          el("div", { class: "actions" },
            el("button", { class: "small", type: "button", onclick: () => startEdit(e.id) }, "Edit"),
            el("button", { class: "small danger", type: "button", onclick: () => removeExpense(e.id) }, "Delete")
          )
        ));
      }
      list.append(group);
    }
  }

  // ---------- expense actions ----------
  $("form").addEventListener("submit", ev => {
    ev.preventDefault();
    const clientId = $("client").value;
    if (!clientId || !clientById(clientId)) {
      toast("Add a client first");
      $("clientName").focus();
      return;
    }
    const amount = Math.round(parseFloat($("amount").value) * 100) / 100;
    const date = $("date").value;
    if (!(amount > 0) || !date) return;
    const data = {
      clientId, amount, date,
      category: $("category").value,
      item: $("item").value.trim(),
      qty: $("qty").value.trim(),
      vendor: $("vendor").value.trim(),
      note: $("note").value.trim(),
      method: $("method").value,
      bill: $("bill").value.trim()
    };

    if (editingId) {
      const e = state.expenses.find(x => x.id === editingId);
      if (e) Object.assign(e, data);
      toast("Expense updated");
      stopEdit();
    } else {
      state.expenses.push({ id: uid(), createdAt: Date.now(), ...data });
      toast(`Added ${money(amount)} for ${clientName(clientId)}`);
      for (const id of ["amount", "item", "qty", "vendor", "note", "bill"]) $(id).value = "";
      $("amount").focus();
    }
    save();
    if (monthOf(date) !== currentMonth()) $("month").value = monthOf(date);
    render();
  });

  function startEdit(id) {
    const e = state.expenses.find(x => x.id === id);
    if (!e) return;
    editingId = id;
    renderClientSelects();
    $("client").value = e.clientId;
    $("amount").value = e.amount;
    $("date").value = e.date;
    $("category").value = catInfo(e.category).name;
    $("item").value = e.item || "";
    $("qty").value = e.qty || "";
    $("vendor").value = e.vendor || "";
    $("note").value = e.note || "";
    $("method").value = e.method || "Other";
    $("bill").value = e.bill || "";
    $("formTitle").textContent = "Edit expense";
    $("submitBtn").textContent = "Save changes";
    $("cancelEdit").hidden = false;
    $("form").scrollIntoView({ behavior: "smooth", block: "start" });
    $("amount").focus({ preventScroll: true });
  }
  function stopEdit() {
    const keepClient = $("client").value;
    editingId = null;
    $("form").reset();
    renderClientSelects();
    if ([...$("client").options].some(o => o.value === keepClient)) $("client").value = keepClient;
    $("date").value = todayISO();
    $("formTitle").textContent = "Record expense";
    $("submitBtn").textContent = "Add expense";
    $("cancelEdit").hidden = true;
  }
  $("cancelEdit").addEventListener("click", stopEdit);

  function removeExpense(id) {
    const idx = state.expenses.findIndex(x => x.id === id);
    if (idx < 0) return;
    const [removed] = state.expenses.splice(idx, 1);
    if (editingId === id) stopEdit();
    save();
    render();
    toast("Expense deleted", () => { state.expenses.push(removed); save(); render(); });
  }

  // ---------- client actions ----------
  function addClient(name, budget) {
    name = name.trim();
    if (!name) return null;
    const existing = state.clients.find(c => c.name.toLowerCase() === name.toLowerCase());
    if (existing) {
      toast(`"${existing.name}" already exists`);
      return existing;
    }
    const c = { id: uid(), name, budget: Math.max(0, budget || 0), archived: false, createdAt: Date.now() };
    state.clients.push(c);
    save();
    return c;
  }

  $("clientForm").addEventListener("submit", ev => {
    ev.preventDefault();
    const name = $("clientName").value.trim();
    const budget = Math.max(0, parseFloat($("clientBudget").value) || 0);
    if (!name) return;
    if (editingClientId) {
      const clash = state.clients.find(c => c.id !== editingClientId && c.name.toLowerCase() === name.toLowerCase());
      if (clash) return toast(`"${clash.name}" already exists`);
      const c = clientById(editingClientId);
      if (c) { c.name = name; c.budget = budget; }
      save();
      toast("Client updated");
      stopEditClient();
    } else {
      const c = addClient(name, budget);
      $("clientForm").reset();
      render();
      if (c && !c.archived) $("client").value = c.id;
      if (c) toast(`Client "${c.name}" ready`);
      return;
    }
    render();
  });

  function startEditClient(id) {
    const c = clientById(id);
    if (!c) return;
    editingClientId = id;
    $("clientName").value = c.name;
    $("clientBudget").value = c.budget || "";
    $("clientFormLabel").textContent = "Client name";
    $("clientSubmit").textContent = "Save client";
    $("clientCancel").hidden = false;
    $("clientName").focus();
  }
  function stopEditClient() {
    editingClientId = null;
    $("clientForm").reset();
    $("clientFormLabel").textContent = "Add a client";
    $("clientSubmit").textContent = "Add client";
    $("clientCancel").hidden = true;
  }
  $("clientCancel").addEventListener("click", stopEditClient);

  function toggleArchive(id) {
    const c = clientById(id);
    if (!c) return;
    c.archived = !c.archived;
    save();
    render();
    toast(c.archived ? `"${c.name}" archived — its expenses stay in your reports` : `"${c.name}" restored`);
  }

  function deleteClient(id) {
    const c = clientById(id);
    if (!c) return;
    const theirs = state.expenses.filter(e => e.clientId === id);
    const msg = theirs.length
      ? `Delete "${c.name}" and their ${plural(theirs.length, "expense")} (${money(sum(theirs))})?\n\nTip: use Archive instead if the project is just finished — that keeps the records.`
      : `Delete "${c.name}"?`;
    if (!confirm(msg)) return;
    const snapClients = state.clients.slice();
    const snapExpenses = state.expenses.slice();
    state.clients = state.clients.filter(x => x.id !== id);
    state.expenses = state.expenses.filter(e => e.clientId !== id);
    if (editingClientId === id) stopEditClient();
    if (editingId && !state.expenses.some(e => e.id === editingId)) stopEdit();
    save();
    render();
    toast(`"${c.name}" deleted`, () => { state.clients = snapClients; state.expenses = snapExpenses; save(); render(); });
  }

  $("quickClient").addEventListener("click", () => {
    const name = prompt("New client / project name:");
    if (!name || !name.trim()) return;
    const c = addClient(name);
    render();
    if (c && !c.archived) $("client").value = c.id;
    $("amount").focus();
  });

  $("toggleArchived").addEventListener("click", () => { showArchived = !showArchived; renderClients(); });

  // ---------- controls ----------
  $("month").addEventListener("change", render);
  $("prevMonth").addEventListener("click", () => { $("month").value = shiftMonth(currentMonth(), -1); render(); });
  $("nextMonth").addEventListener("click", () => { $("month").value = shiftMonth(currentMonth(), 1); render(); });
  $("search").addEventListener("input", render);
  for (const id of ["filterCat", "filterClient", "groupBy"]) $(id).addEventListener("change", render);
  $("printBtn").addEventListener("click", () => window.print());

  function applyTheme() {
    if (state.theme) document.documentElement.setAttribute("data-theme", state.theme);
    else document.documentElement.removeAttribute("data-theme");
  }
  $("themeBtn").addEventListener("click", () => {
    const isDark = state.theme ? state.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    state.theme = isDark ? "light" : "dark";
    applyTheme();
    save();
  });

  // ---------- CSV ----------
  const csvCell = v => {
    const s = String(v ?? "");
    return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  function download(filename, rows) {
    // BOM so Excel opens ₹ and other symbols correctly
    const blob = new Blob(["﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = el("a", { href: URL.createObjectURL(blob), download: filename });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  $("exportBtn").addEventListener("click", () => {
    if (!state.expenses.length) return toast("Nothing to export yet");
    const rows = [["date", "client", "amount", "category", "item", "quantity", "vendor", "description", "method", "bill"]];
    for (const e of [...state.expenses].sort((a, b) => a.date.localeCompare(b.date))) {
      rows.push([e.date, clientName(e.clientId), e.amount, e.category, e.item, e.qty, e.vendor, e.note, e.method, e.bill]);
    }
    download(`client-expenses-${todayISO()}.csv`, rows);
  });

  $("exportMonthBtn").addEventListener("click", () => {
    const ym = currentMonth();
    const monthExpenses = state.expenses.filter(e => monthOf(e.date) === ym);
    if (!monthExpenses.length) return toast("Nothing recorded this month");
    const usedCats = CATEGORIES.map(c => c.name).filter(n => monthExpenses.some(e => e.category === n));
    const rows = [["client", ...usedCats, "total"]];
    const ids = [...new Set(monthExpenses.map(e => e.clientId))].sort((a, b) => clientName(a).localeCompare(clientName(b)));
    for (const id of ids) {
      const mine = monthExpenses.filter(e => e.clientId === id);
      rows.push([clientName(id), ...usedCats.map(n => sum(mine.filter(e => e.category === n)) || ""), sum(mine)]);
    }
    rows.push(["TOTAL", ...usedCats.map(n => sum(monthExpenses.filter(e => e.category === n))), sum(monthExpenses)]);
    download(`client-summary-${ym}.csv`, rows);
  });

  function parseCSV(text) {
    text = text.replace(/^﻿/, "");
    const rows = [];
    let row = [], cell = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (inQuotes) {
        if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (ch === '"') inQuotes = false;
        else cell += ch;
      } else if (ch === '"') inQuotes = true;
      else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else cell += ch;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(r => r.some(c => c.trim()));
  }

  $("importBtn").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", async () => {
    const file = $("importFile").files[0];
    $("importFile").value = "";
    if (!file) return;
    const rows = parseCSV(await file.text());
    if (!rows.length) return toast("That file is empty");
    const header = rows[0].map(h => h.trim().toLowerCase());
    const col = name => header.indexOf(name);
    if (col("date") < 0 || col("amount") < 0 || col("client") < 0) return toast("CSV needs 'date', 'client' and 'amount' columns");

    const key = e => `${e.date}|${e.clientId}|${e.amount}|${e.category}|${e.item || ""}|${e.note}|${e.vendor}`;
    const existing = new Set(state.expenses.map(key));
    let added = 0, skipped = 0;
    for (const r of rows.slice(1)) {
      const get = name => (col(name) >= 0 ? (r[col(name)] || "").trim() : "");
      const amount = Math.round(parseFloat(get("amount").replace(/[^\d.\-]/g, "")) * 100) / 100;
      const date = get("date");
      const name = get("client");
      if (!(amount > 0) || !/^\d{4}-\d{2}-\d{2}$/.test(date) || !name) { skipped++; continue; }
      const client = state.clients.find(c => c.name.toLowerCase() === name.toLowerCase()) || addClient(name);
      const e = {
        id: uid(), createdAt: Date.now(), clientId: client.id, date, amount,
        category: catInfo(get("category") || itemCategory[get("item").toLowerCase()]).name,
        item: get("item"), qty: get("quantity") || get("qty"), vendor: get("vendor"),
        note: get("description") || get("note"), method: get("method") || "Other", bill: get("bill")
      };
      if (existing.has(key(e))) { skipped++; continue; }
      existing.add(key(e));
      state.expenses.push(e);
      added++;
    }
    save();
    render();
    toast(`Imported ${plural(added, "expense")}${skipped ? `, skipped ${skipped}` : ""}`);
  });

  $("clearBtn").addEventListener("click", () => {
    if (!state.clients.length && !state.expenses.length) return;
    if (!confirm(`Delete all ${plural(state.clients.length, "client")} and ${plural(state.expenses.length, "expense")}?`)) return;
    const snap = { clients: state.clients, expenses: state.expenses };
    state.clients = [];
    state.expenses = [];
    stopEdit();
    stopEditClient();
    save();
    render();
    toast("Everything deleted", () => { state.clients = snap.clients; state.expenses = snap.expenses; save(); render(); });
  });

  render();
})();
</script>
</body>
</html>
