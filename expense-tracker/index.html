<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker</title>
<meta name="description" content="A simple personal expense tracker. Your data stays in this browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F5FC;
    --surface: #FFFFFF;
    --surface-2: #EEEEF8;
    --text: #14183C;
    --muted: #5B5F82;
    --border: #DCDCEC;
    --primary: #2A1FA8;
    --primary-text: #FFFFFF;
    --accent: #FF7A2F;
    --danger: #C62828;
    --ok: #1B7F4B;
    --shadow: 0 1px 2px rgba(20, 24, 60, .06), 0 4px 16px rgba(20, 24, 60, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1124;
      --surface: #181B33;
      --surface-2: #22264A;
      --text: #ECEDF8;
      --muted: #A3A6C8;
      --border: #2E3260;
      --primary: #8C82FF;
      --primary-text: #0F1124;
      --accent: #FF9A5C;
      --danger: #FF6B6B;
      --ok: #4CD38A;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1124;
    --surface: #181B33;
    --surface-2: #22264A;
    --text: #ECEDF8;
    --muted: #A3A6C8;
    --border: #2E3260;
    --primary: #8C82FF;
    --primary-text: #0F1124;
    --accent: #FF9A5C;
    --danger: #FF6B6B;
    --ok: #4CD38A;
    --shadow: none;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "DM Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2 { font-family: "Poppins", system-ui, sans-serif; margin: 0; }
  h1 { font-size: 1.5rem; }
  h2 { font-size: 1.05rem; margin-bottom: 12px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }

  header.top {
    display: flex; flex-wrap: wrap; gap: 12px;
    align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }
  .top-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    box-shadow: var(--shadow);
  }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat .label { color: var(--muted); font-size: .85rem; }
  .stat .value { font-family: "Poppins", sans-serif; font-size: 1.35rem; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat .sub { color: var(--muted); font-size: .8rem; margin-top: 4px; }
  .over { color: var(--danger); }
  .under { color: var(--ok); }

  .meter { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 8px; }
  .meter > span { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width .3s; }
  .meter.is-over > span { background: var(--danger); }

  .grid { display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: start; }
  .side { display: grid; gap: 16px; }

  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  .field { margin-bottom: 12px; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  input, select, button { font: inherit; color: inherit; }
  input, select {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
  }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  .top-controls input, .top-controls select { width: auto; }

  button {
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 8px 12px;
    border-radius: 9px;
    cursor: pointer;
  }
  button:hover { background: var(--surface-2); }
  button.primary { background: var(--primary); color: var(--primary-text); border-color: var(--primary); font-weight: 700; }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: var(--danger); }
  button.small { padding: 4px 8px; font-size: .8rem; }
  .form-actions { display: flex; gap: 8px; }
  .form-actions .primary { flex: 1; }

  .cat-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; margin-bottom: 10px; font-size: .9rem; }
  .cat-row .bar { grid-column: 1 / -1; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .cat-row .bar span { display: block; height: 100%; border-radius: 999px; }
  .cat-row .amt { font-variant-numeric: tabular-nums; }
  .cat-row .pct { color: var(--muted); font-size: .8rem; margin-left: 6px; }

  .list-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .list-head h2 { margin: 0; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filters input, .filters select { width: auto; }

  .day { margin-top: 14px; }
  .day-head { display: flex; justify-content: space-between; color: var(--muted); font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 0 4px 6px; border-bottom: 1px solid var(--border); }
  .item { display: grid; grid-template-columns: 36px 1fr auto auto; gap: 10px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--border); }
  .item:last-child { border-bottom: 0; }
  .dot { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 1.1rem; }
  .item .title { font-weight: 500; overflow-wrap: anywhere; }
  .item .meta { color: var(--muted); font-size: .8rem; }
  .item .amount { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item .actions { display: flex; gap: 4px; }

  .empty { text-align: center; color: var(--muted); padding: 32px 8px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .note { color: var(--muted); font-size: .8rem; margin-top: 10px; }

  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(120%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px;
    transition: transform .25s; z-index: 10; display: flex; width: max-content; max-width: calc(100% - 32px); gap: 12px; align-items: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast button { background: transparent; color: var(--bg); border-color: currentColor; }

  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
    .side { display: contents; }
    #form { order: 1; }
    #listCard { order: 2; }
    .side > .card:not(#form) { order: 3; }
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 480px) {
    .item { grid-template-columns: 32px 1fr auto; }
    .item .actions { grid-column: 2 / -1; justify-content: flex-end; }
    .dot { width: 32px; height: 32px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Expense Tracker</h1>
    <div class="top-controls">
      <input type="month" id="month" aria-label="Month">
      <button id="prevMonth" aria-label="Previous month">‹</button>
      <button id="nextMonth" aria-label="Next month">›</button>
      <select id="currency" aria-label="Currency">
        <option value="INR">₹ INR</option>
        <option value="USD">$ USD</option>
        <option value="EUR">€ EUR</option>
        <option value="GBP">£ GBP</option>
        <option value="AED">AED</option>
      </select>
      <button id="themeBtn" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <section class="stats">
    <div class="card stat">
      <div class="label">Spent this month</div>
      <div class="value" id="statTotal">–</div>
      <div class="sub" id="statPrev"></div>
    </div>
    <div class="card stat">
      <div class="label">Budget left</div>
      <div class="value" id="statBudget">–</div>
      <div class="meter" id="budgetMeter"><span></span></div>
    </div>
    <div class="card stat">
      <div class="label">Daily average</div>
      <div class="value" id="statAvg">–</div>
      <div class="sub" id="statAvgSub"></div>
    </div>
    <div class="card stat">
      <div class="label">Biggest category</div>
      <div class="value" id="statTop">–</div>
      <div class="sub" id="statTopSub"></div>
    </div>
  </section>

  <div class="grid">
    <div class="side">
      <form class="card" id="form" autocomplete="off">
        <h2 id="formTitle">Add expense</h2>
        <div class="row-2">
          <div class="field">
            <label for="amount">Amount</label>
            <input id="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required placeholder="0.00">
          </div>
          <div class="field">
            <label for="date">Date</label>
            <input id="date" type="date" required>
          </div>
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category" required></select>
        </div>
        <div class="field">
          <label for="note">Note</label>
          <input id="note" type="text" maxlength="120" placeholder="e.g. Lunch with team">
        </div>
        <div class="field">
          <label for="method">Paid with</label>
          <select id="method">
            <option>UPI</option>
            <option>Cash</option>
            <option>Debit card</option>
            <option>Credit card</option>
            <option>Net banking</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="submit" class="primary" id="submitBtn">Add expense</button>
          <button type="button" id="cancelEdit" hidden>Cancel</button>
        </div>
      </form>

      <div class="card">
        <h2>Monthly budget</h2>
        <form id="budgetForm" class="row-2" style="grid-template-columns: 1fr auto;">
          <input id="budget" type="number" min="0" step="1" inputmode="numeric" placeholder="Set a budget" aria-label="Monthly budget">
          <button type="submit">Save</button>
        </form>
      </div>

      <div class="card">
        <h2>By category</h2>
        <div id="breakdown"></div>
      </div>

      <div class="card">
        <h2>Data</h2>
        <div class="tools">
          <button id="exportBtn" type="button">Export CSV</button>
          <button id="importBtn" type="button">Import CSV</button>
          <button id="clearBtn" type="button" class="danger">Delete all</button>
          <input id="importFile" type="file" accept=".csv,text/csv" hidden>
        </div>
        <p class="note">Your expenses are saved only in this browser. Export a CSV now and then as a backup.</p>
      </div>
    </div>

    <section class="card" id="listCard">
      <div class="list-head">
        <h2 id="listTitle">Expenses</h2>
        <div class="filters">
          <input id="search" type="search" placeholder="Search notes" aria-label="Search">
          <select id="filterCat" aria-label="Filter by category"></select>
        </div>
      </div>
      <div id="list"></div>
    </section>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" class="small" hidden>Undo</button></div>

<script>
(function () {
  "use strict";

  const STORE_KEY = "expense-tracker.v1";
  const CATEGORIES = [
    { name: "Food & Dining",  icon: "🍽️", color: "#FF7A2F" },
    { name: "Groceries",      icon: "🛒", color: "#2FA36B" },
    { name: "Transport",      icon: "🚗", color: "#2A7FD8" },
    { name: "Rent & Housing", icon: "🏠", color: "#7A4FD8" },
    { name: "Bills & Utilities", icon: "💡", color: "#D8A12A" },
    { name: "Shopping",       icon: "🛍️", color: "#D8457A" },
    { name: "Health",         icon: "💊", color: "#1FA8A0" },
    { name: "Entertainment",  icon: "🎬", color: "#A84FD8" },
    { name: "Education",      icon: "📚", color: "#4F6BD8" },
    { name: "Travel",         icon: "✈️", color: "#3FA8D8" },
    { name: "Other",          icon: "📦", color: "#8A8FA8" }
  ];
  const catByName = Object.fromEntries(CATEGORIES.map(c => [c.name, c]));
  const catInfo = name => catByName[name] || catByName.Other;

  // ---------- state ----------
  let state = load();
  let editingId = null;
  let undoSnapshot = null;

  function load() {
    const fallback = { expenses: [], budget: 0, currency: "INR", theme: "" };
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return fallback;
      const data = JSON.parse(raw);
      return {
        expenses: Array.isArray(data.expenses) ? data.expenses.filter(validExpense) : [],
        budget: Number(data.budget) || 0,
        currency: data.currency || "INR",
        theme: data.theme || ""
      };
    } catch (e) {
      return fallback;
    }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { toast("Couldn't save — browser storage is unavailable."); }
  }
  function validExpense(e) {
    return e && typeof e.id === "string" && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && Number(e.amount) > 0;
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const monthOf = iso => iso.slice(0, 7);
  const daysInMonth = ym => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
  function shiftMonth(ym, delta) {
    const [y, m] = ym.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  }
  function money(n) {
    try {
      const locale = state.currency === "INR" ? "en-IN" : undefined;
      return new Intl.NumberFormat(locale, { style: "currency", currency: state.currency, maximumFractionDigits: 2 }).format(n);
    } catch (e) {
      return n.toFixed(2);
    }
  }
  function monthLabel(ym) {
    const [y, m] = ym.split("-").map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
  }
  function dayLabel(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    const date = new Date(y, m - 1, d);
    if (iso === todayISO()) return "Today";
    const yest = new Date(); yest.setDate(yest.getDate() - 1);
    if (date.toDateString() === yest.toDateString()) return "Yesterday";
    return date.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  }
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") node.className = v;
      else if (k === "style") node.style.cssText = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    }
    for (const c of children) if (c != null) node.append(c);
    return node;
  }

  let toastTimer;
  function toast(msg, onUndo) {
    $("toastMsg").textContent = msg;
    const undoBtn = $("toastUndo");
    undoBtn.hidden = !onUndo;
    undoBtn.onclick = () => { onUndo(); $("toast").classList.remove("show"); };
    $("toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $("toast").classList.remove("show"), onUndo ? 6000 : 2500);
  }

  // ---------- setup ----------
  for (const c of CATEGORIES) $("category").append(el("option", { value: c.name }, `${c.icon} ${c.name}`));
  $("filterCat").append(el("option", { value: "" }, "All categories"));
  for (const c of CATEGORIES) $("filterCat").append(el("option", { value: c.name }, c.name));

  $("month").value = monthOf(todayISO());
  $("date").value = todayISO();
  $("currency").value = state.currency;
  if (state.budget) $("budget").value = state.budget;
  applyTheme();

  // ---------- render ----------
  function render() {
    const ym = $("month").value || monthOf(todayISO());
    const monthExpenses = state.expenses.filter(e => monthOf(e.date) === ym);
    const total = sum(monthExpenses);

    // stats
    $("statTotal").textContent = money(total);
    const prevTotal = sum(state.expenses.filter(e => monthOf(e.date) === shiftMonth(ym, -1)));
    if (prevTotal > 0) {
      const diff = ((total - prevTotal) / prevTotal) * 100;
      $("statPrev").textContent = `${diff >= 0 ? "▲" : "▼"} ${Math.abs(diff).toFixed(0)}% vs last month`;
      $("statPrev").className = "sub " + (diff > 0 ? "over" : "under");
    } else {
      $("statPrev").textContent = `${monthExpenses.length} transaction${monthExpenses.length === 1 ? "" : "s"}`;
      $("statPrev").className = "sub";
    }

    const meter = $("budgetMeter");
    if (state.budget > 0) {
      const left = state.budget - total;
      $("statBudget").textContent = money(left);
      $("statBudget").className = "value " + (left < 0 ? "over" : "");
      meter.hidden = false;
      meter.classList.toggle("is-over", left < 0);
      meter.firstElementChild.style.width = Math.min(100, (total / state.budget) * 100) + "%";
    } else {
      $("statBudget").textContent = "Not set";
      $("statBudget").className = "value";
      meter.hidden = true;
    }

    const isCurrent = ym === monthOf(todayISO());
    const daysElapsed = isCurrent ? new Date().getDate() : daysInMonth(ym);
    $("statAvg").textContent = money(total / daysElapsed);
    $("statAvgSub").textContent = isCurrent ? `over ${daysElapsed} day${daysElapsed === 1 ? "" : "s"} so far` : `over ${daysElapsed} days`;

    const byCat = {};
    for (const e of monthExpenses) byCat[e.category] = (byCat[e.category] || 0) + e.amount;
    const sorted = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    if (sorted.length) {
      $("statTop").textContent = `${catInfo(sorted[0][0]).icon} ${sorted[0][0]}`;
      $("statTopSub").textContent = `${money(sorted[0][1])} · ${((sorted[0][1] / total) * 100).toFixed(0)}% of spend`;
    } else {
      $("statTop").textContent = "–";
      $("statTopSub").textContent = "";
    }

    // breakdown
    const bd = $("breakdown");
    bd.replaceChildren();
    if (!sorted.length) bd.append(el("div", { class: "empty", style: "padding:12px" }, "Nothing spent this month yet."));
    for (const [name, amt] of sorted) {
      const c = catInfo(name);
      const pct = (amt / total) * 100;
      bd.append(el("div", { class: "cat-row" },
        el("span", null, `${c.icon} ${name}`),
        el("span", { class: "amt" }, money(amt), el("span", { class: "pct" }, `${pct.toFixed(0)}%`)),
        el("div", { class: "bar" }, el("span", { style: `width:${pct}%;background:${c.color}` }))
      ));
    }

    // list
    $("listTitle").textContent = `Expenses · ${monthLabel(ym)}`;
    const q = $("search").value.trim().toLowerCase();
    const fc = $("filterCat").value;
    const shown = monthExpenses
      .filter(e => (!fc || e.category === fc) && (!q || (e.note || "").toLowerCase().includes(q) || e.category.toLowerCase().includes(q) || (e.method || "").toLowerCase().includes(q)))
      .sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));

    const list = $("list");
    list.replaceChildren();
    if (!shown.length) {
      list.append(el("div", { class: "empty" }, monthExpenses.length ? "No expenses match your filters." : "No expenses for this month. Add one using the form."));
      return;
    }
    const groups = new Map();
    for (const e of shown) {
      if (!groups.has(e.date)) groups.set(e.date, []);
      groups.get(e.date).push(e);
    }
    for (const [date, items] of groups) {
      const day = el("div", { class: "day" },
        el("div", { class: "day-head" }, el("span", null, dayLabel(date)), el("span", null, money(sum(items))))
      );
      for (const e of items) {
        const c = catInfo(e.category);
        day.append(el("div", { class: "item" },
          el("div", { class: "dot", style: `background:${c.color}22` }, c.icon),
          el("div", null,
            el("div", { class: "title" }, e.note || e.category),
            el("div", { class: "meta" }, [e.note ? e.category : null, e.method].filter(Boolean).join(" · "))
          ),
          el("div", { class: "amount" }, money(e.amount)),
          el("div", { class: "actions" },
            el("button", { class: "small", type: "button", "aria-label": "Edit", onclick: () => startEdit(e.id) }, "Edit"),
            el("button", { class: "small danger", type: "button", "aria-label": "Delete", onclick: () => remove(e.id) }, "Delete")
          )
        ));
      }
      list.append(day);
    }
  }
  const sum = arr => arr.reduce((s, e) => s + e.amount, 0);

  // ---------- actions ----------
  $("form").addEventListener("submit", ev => {
    ev.preventDefault();
    const amount = Math.round(parseFloat($("amount").value) * 100) / 100;
    const date = $("date").value;
    if (!(amount > 0) || !date) return;
    const data = { amount, date, category: $("category").value, note: $("note").value.trim(), method: $("method").value };

    if (editingId) {
      const e = state.expenses.find(x => x.id === editingId);
      if (e) Object.assign(e, data);
      toast("Expense updated");
      stopEdit();
    } else {
      state.expenses.push({ id: uid(), createdAt: Date.now(), ...data });
      toast(`Added ${money(amount)}`);
      $("amount").value = "";
      $("note").value = "";
      $("amount").focus();
    }
    save();
    if (monthOf(date) !== $("month").value) $("month").value = monthOf(date);
    render();
  });

  function startEdit(id) {
    const e = state.expenses.find(x => x.id === id);
    if (!e) return;
    editingId = id;
    $("amount").value = e.amount;
    $("date").value = e.date;
    $("category").value = catInfo(e.category).name;
    $("note").value = e.note || "";
    $("method").value = e.method || "Other";
    $("formTitle").textContent = "Edit expense";
    $("submitBtn").textContent = "Save changes";
    $("cancelEdit").hidden = false;
    $("form").scrollIntoView({ behavior: "smooth", block: "start" });
    $("amount").focus({ preventScroll: true });
  }
  function stopEdit() {
    editingId = null;
    $("form").reset();
    $("date").value = todayISO();
    $("formTitle").textContent = "Add expense";
    $("submitBtn").textContent = "Add expense";
    $("cancelEdit").hidden = true;
  }
  $("cancelEdit").addEventListener("click", stopEdit);

  function remove(id) {
    const idx = state.expenses.findIndex(x => x.id === id);
    if (idx < 0) return;
    const [removed] = state.expenses.splice(idx, 1);
    if (editingId === id) stopEdit();
    save();
    render();
    toast("Expense deleted", () => { state.expenses.push(removed); save(); render(); });
  }

  $("budgetForm").addEventListener("submit", ev => {
    ev.preventDefault();
    state.budget = Math.max(0, parseFloat($("budget").value) || 0);
    save();
    render();
    toast(state.budget ? `Budget set to ${money(state.budget)}` : "Budget cleared");
  });

  $("month").addEventListener("change", render);
  $("prevMonth").addEventListener("click", () => { $("month").value = shiftMonth($("month").value || monthOf(todayISO()), -1); render(); });
  $("nextMonth").addEventListener("click", () => { $("month").value = shiftMonth($("month").value || monthOf(todayISO()), 1); render(); });
  $("search").addEventListener("input", render);
  $("filterCat").addEventListener("change", render);
  $("currency").addEventListener("change", () => { state.currency = $("currency").value; save(); render(); });

  function applyTheme() {
    if (state.theme) document.documentElement.setAttribute("data-theme", state.theme);
    else document.documentElement.removeAttribute("data-theme");
  }
  $("themeBtn").addEventListener("click", () => {
    const isDark = state.theme ? state.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    state.theme = isDark ? "light" : "dark";
    applyTheme();
    save();
  });

  // ---------- CSV ----------
  const csvCell = v => {
    const s = String(v ?? "");
    return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  $("exportBtn").addEventListener("click", () => {
    if (!state.expenses.length) return toast("Nothing to export yet");
    const rows = [["date", "amount", "category", "note", "method"]];
    for (const e of [...state.expenses].sort((a, b) => a.date.localeCompare(b.date))) rows.push([e.date, e.amount, e.category, e.note, e.method]);
    const blob = new Blob([rows.map(r => r.map(csvCell).join(",")).join("\n")], { type: "text/csv" });
    const a = el("a", { href: URL.createObjectURL(blob), download: `expenses-${todayISO()}.csv` });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  function parseCSV(text) {
    const rows = [];
    let row = [], cell = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (inQuotes) {
        if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (ch === '"') inQuotes = false;
        else cell += ch;
      } else if (ch === '"') inQuotes = true;
      else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else cell += ch;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(r => r.some(c => c.trim()));
  }

  $("importBtn").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", async () => {
    const file = $("importFile").files[0];
    $("importFile").value = "";
    if (!file) return;
    const rows = parseCSV(await file.text());
    if (!rows.length) return toast("That file is empty");
    const header = rows[0].map(h => h.trim().toLowerCase());
    const col = name => header.indexOf(name);
    if (col("date") < 0 || col("amount") < 0) return toast("CSV needs at least 'date' and 'amount' columns");

    const existing = new Set(state.expenses.map(e => `${e.date}|${e.amount}|${e.category}|${e.note}`));
    let added = 0, skipped = 0;
    for (const r of rows.slice(1)) {
      const get = name => (col(name) >= 0 ? (r[col(name)] || "").trim() : "");
      const amount = Math.round(parseFloat(get("amount").replace(/[^\d.\-]/g, "")) * 100) / 100;
      const date = get("date");
      if (!(amount > 0) || !/^\d{4}-\d{2}-\d{2}$/.test(date)) { skipped++; continue; }
      const e = { id: uid(), createdAt: Date.now(), date, amount, category: catInfo(get("category")).name, note: get("note"), method: get("method") || "Other" };
      const key = `${e.date}|${e.amount}|${e.category}|${e.note}`;
      if (existing.has(key)) { skipped++; continue; }
      existing.add(key);
      state.expenses.push(e);
      added++;
    }
    save();
    render();
    toast(`Imported ${added} expense${added === 1 ? "" : "s"}${skipped ? `, skipped ${skipped}` : ""}`);
  });

  $("clearBtn").addEventListener("click", () => {
    if (!state.expenses.length) return;
    if (!confirm(`Delete all ${state.expenses.length} expenses? This can be undone for a few seconds.`)) return;
    undoSnapshot = state.expenses;
    state.expenses = [];
    stopEdit();
    save();
    render();
    toast("All expenses deleted", () => { state.expenses = undoSnapshot; save(); render(); });
  });

  render();
})();
</script>
</body>
</html>
